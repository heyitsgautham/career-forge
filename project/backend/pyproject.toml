[project]
name = "careerforge-backend"
version = "0.1.0"
description = "FastAPI backend for CareerForge: GitHub-grounded resumes, skill gaps, roadmaps and job matching"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web framework
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    # Database
    "sqlalchemy>=2.0.36",
    "aiosqlite==0.19.0",
    # AWS SDK
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    # Scheduler
    "apscheduler>=3.10",
    # Vector store
    "chromadb==0.4.18",
    # GitHub integration and HTTP clients
    "pygithub==2.1.1",
    "httpx==0.28.1",
    "aiohttp==3.14.5",
    "pyjwt==2.15.1",
    # Document processing
    "pymupdf==1.24.14",
    "python-docx==1.1.0",
    # Settings and validation
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "email-validator==2.3.0",
    "python-dotenv==1.2.4",
    # Security
    "cryptography==50.0.2",
    "bcrypt==5.0.0",
    # Scraping
    "beautifulsoup4==4.12.3",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "pyvirtualdisplay>=3.0",
    "python-jobspy==1.1.82",
    # Utilities
    "tenacity==8.2.3",
    "structlog==23.2.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.8.4",
]

[tool.uv]
package = false
# Transitive packages pulled in through chromadb's tokenizers, held at patched releases
constraint-dependencies = ["httpx2>=2.12.0", "httpcore2>=2.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501",  # ruff format owns line length; long prompt strings stay intact
    "B008",  # FastAPI declares dependencies as Depends() defaults
]

[tool.ruff.lint.per-file-ignores]
# Models import related models at the bottom to break circular imports
"app/models/*" = ["E402"]
# main.py configures logging before importing modules that log at import time
"app/main.py" = ["E402"]
# Scripts put the backend on sys.path before importing app modules
"scripts/*" = ["E402"]
# Pydantic request models have a field named status
"app/api/routes/applications.py" = ["F811"]
