[project]
name = "careerforge-backend"
version = "0.1.0"
description = "FastAPI backend for CareerForge: GitHub-grounded resumes, skill gaps, roadmaps and job matching"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Web framework
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    # Database
    "sqlalchemy>=2.0.36",
    "aiosqlite==0.19.0",
    # AWS SDK
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    # Scheduler
    "apscheduler>=3.10",
    # Vector store
    "chromadb==0.4.18",
    # GitHub integration and HTTP clients
    "pygithub==2.1.1",
    "httpx==0.25.2",
    "aiohttp==3.9.1",
    "pyjwt==2.8.0",
    # Document processing
    "pymupdf==1.24.14",
    "python-docx==1.1.0",
    # Settings and validation
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "email-validator==2.1.0",
    "python-dotenv==1.0.0",
    # Security
    "cryptography==41.0.7",
    "bcrypt==4.1.2",
    # Scraping
    "beautifulsoup4==4.12.3",
    "playwright>=1.49.0",
    "playwright-stealth>=1.0.6",
    "pyvirtualdisplay>=3.0",
    "python-jobspy==1.1.82",
    # Utilities
    "tenacity==8.2.3",
    "structlog==23.2.0",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "ruff==0.8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
