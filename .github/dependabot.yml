version: 2
updates:
  - package-ecosystem: uv
    directory: /project/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /project/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /project/backend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /project/frontend
    schedule:
      interval: monthly
