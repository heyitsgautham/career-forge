name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.14"
          enable-cache: true
          cache-dependency-glob: project/backend/uv.lock
      - name: Install dependencies from the lockfile
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: project/backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: project/frontend/.nvmrc
          cache: npm
          cache-dependency-path: project/frontend/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests with coverage
        run: npm run test:coverage
      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.5.14"
      - name: pip-audit (backend)
        working-directory: project/backend
        # chromadb 0.4.18 advisories have no fixed release and affect the Chroma server, not the client.
        # markdownify is pinned by python-jobspy 1.1.82, which has no newer release.
        run: >-
          uvx --from pip-audit==2.9.0 pip-audit -r requirements.txt --progress-spinner off
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-1604
      - uses: actions/setup-node@v4
        with:
          node-version-file: project/frontend/.nvmrc
      - name: npm audit (frontend)
        working-directory: project/frontend
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner
